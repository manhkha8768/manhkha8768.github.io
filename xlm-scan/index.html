<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XLM Scan</title>
<meta name="description" content="Quét tài liệu, xuất PDF, nhận dạng chữ tiếng Việt và gắn tài liệu vào tài sản — Công ty Xây lắp Mỏ – TKV">
<meta name="theme-color" content="#0E5A78" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E151A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="XLM Scan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/be-vietnam-pro-vietnamese-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell" id="shell">

  <!-- Trang chủ -->
  <section id="tab-home" data-tab="home">
    <header class="topbar"><div class="wrap">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="var(--primary)"/><path d="M9 12V9h3M20 9h3v3M23 20v3h-3M12 23H9v-3" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 14h6M13 17h6M13 20h4" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>XLM Scan</span>
      </div>
      <button class="icon-btn" id="settings-btn" type="button" aria-label="Cài đặt"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
    </div></header>
    <div class="wrap">
      <div class="banner" id="install-banner" hidden>
        <div class="t"><b>Cài XLM Scan lên màn hình chính</b>Mở nhanh như app, dùng được khi không có mạng.</div>
        <button class="btn sm primary" id="install-btn">Cài đặt</button>
      </div>
      <div class="search">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="home-q" type="search" placeholder="Tìm tài liệu của tôi…" autocomplete="off" readonly>
      </div>
      <div id="home-body"></div>
    </div>
  </section>

  <!-- Tài liệu của tôi -->
  <section id="tab-docs" data-tab="docs" hidden>
    <header class="topbar"><div class="wrap">
      <div class="h1">Tài liệu</div>
      <span class="count" id="doc-total"></span>
      <button class="icon-btn" id="sort-btn" type="button" aria-label="Sắp xếp"><svg class="i" viewBox="0 0 24 24"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg></button>
      <button class="icon-btn" id="view-btn" type="button" aria-label="Đổi kiểu xem"></button>
      <button class="btn sm ghost" id="sel-btn" type="button">Chọn</button>
    </div></header>
    <div class="wrap">
      <div class="search">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Tìm theo tên, nhãn, mã tài sản, nội dung chữ…" autocomplete="off">
      </div>
      <div class="chips" id="folder-chips" role="toolbar" aria-label="Thư mục và nhãn"></div>
      <ul class="list" id="doc-list"></ul>
      <div class="empty" id="doc-empty" hidden></div>
    </div>
  </section>

  <!-- Công cụ -->
  <section id="tab-tools" data-tab="tools" hidden>
    <header class="topbar"><div class="wrap"><div class="h1">Công cụ</div></div></header>
    <div class="wrap" id="tools-body"></div>
  </section>

  <!-- Tài sản -->
  <section id="tab-assets" data-tab="assets" hidden>
    <header class="topbar"><div class="wrap">
      <div class="h1">Tài sản &amp; thiết bị</div>
      <button class="icon-btn" id="asset-import" aria-label="Nhập danh sách"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg></button>
      <button class="icon-btn" id="asset-add" aria-label="Thêm tài sản"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div></header>
    <div class="wrap">
      <div class="search">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="aq" type="search" placeholder="Tìm mã, tên, phân xưởng…" autocomplete="off">
      </div>
      <ul class="list" id="asset-list"></ul>
      <div class="empty" id="asset-empty" hidden></div>
    </div>
  </section>

  <!-- Cài đặt -->
  <section id="tab-settings" data-tab="settings" hidden>
    <header class="topbar"><div class="wrap"><button class="icon-btn" type="button" aria-label="Về trang chủ" onclick="setTab('home')"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><div class="h1">Cài đặt</div></div></header>
    <div class="wrap" id="settings-body"></div>
  </section>
</div>

<button class="support" id="support-btn" type="button" aria-label="Hỗ trợ: 0396 228 768"><svg class="i" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>0396 228 768</button>

<nav class="tabbar" aria-label="Điều hướng chính"><div class="wrap">
  <button class="tab" data-go="home" aria-current="page"><svg class="i" viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Trang chủ</button>
  <button class="tab" data-go="docs"><svg class="i" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>Tài liệu</button>
  <button class="tab-scan" id="scan-btn" aria-label="Quét tài liệu"><svg class="i" viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M4 12h16"/></svg></button>
  <button class="tab" data-go="tools"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Công cụ</button>
  <button class="tab" data-go="assets"><svg class="i" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>Tài sản</button>
</div></nav>

<input type="file" id="cam-input" accept="image/*" capture="environment" hidden>
<input type="file" id="gal-input" accept="image/*" multiple hidden>
<input type="file" id="file-input" hidden>

<script src="imaging.js"></script>
<script src="app.js"></script>
<script src="camera.js"></script>
<script src="annotate.js"></script>
<script src="exporter.js"></script>
<script src="tools.js"></script>
<script src="lock.js"></script>
<script>boot();</script>
</body>
</html>
